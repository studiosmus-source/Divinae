name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Divinae-build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Divinae-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

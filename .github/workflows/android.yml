name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install manuscript fonts
        run: |
          mkdir -p app/src/main/res/font
          curl -L --fail https://raw.githubusercontent.com/google/fonts/main/ofl/imfellenglish/IMFeENrm28P.ttf -o app/src/main/res/font/im_fell_english.ttf
          curl -L --fail 'https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf' -o app/src/main/res/font/eb_garamond.ttf
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Divinae-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline fireplace ambience
        run: |
          mkdir -p app/src/main/res/raw
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/yessur3808/atmosphere/75afc5bbe3313d6c43ef4cf5c079ce23a1de1200/public/assets/audio-low/fire/01-small-hearth.mp3" -o /tmp/fireplace-source.mp3
          cp /tmp/fireplace-source.mp3 app/src/main/res/raw/fireplace.mp3
          test -s app/src/main/res/raw/fireplace.mp3
      - name: Build APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Divinae-build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Divinae-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
